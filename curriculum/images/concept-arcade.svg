<text x="20" y="64" font-family="Consolas, Menlo, Courier New, monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#0969da" font-weight="bold">leftPower = drive + turn</tspan><tspan fill="#1f2328" font-weight="normal">      </tspan><tspan fill="#8250df" font-weight="bold">rightPower = drive − turn</tspan></text>
