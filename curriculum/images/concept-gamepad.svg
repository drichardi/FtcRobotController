<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Gamepad map with Java names">
<title>Gamepad map with Java names</title>
<defs></defs>
<rect x="0.5" y="0.5" width="979" height="559" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<text x="20" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">The gamepad in Java</text>
<text x="20" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">Every name starts with gamepad1. (or gamepad2.)   Example: gamepad1.left_stick_y</text>
<rect x="300" y="168" width="90" height="34" rx="10" fill="#c9d1d9" stroke="#59636e" stroke-width="1"/>
<rect x="590" y="168" width="90" height="34" rx="10" fill="#c9d1d9" stroke="#59636e" stroke-width="1"/>
<rect x="294" y="206" width="102" height="20" rx="8" fill="#d0d7de" stroke="#59636e" stroke-width="1"/>
<rect x="584" y="206" width="102" height="20" rx="8" fill="#d0d7de" stroke="#59636e" stroke-width="1"/>
<path d="M290,230 Q490,200 690,230 Q750,260 740,380 Q730,450 670,440 Q620,430 580,360 L400,360 Q360,430 310,440 Q250,450 240,380 Q230,260 290,230 Z" stroke="#59636e" stroke-width="2" fill="#eaeef2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="318" y="256" width="24" height="68" rx="3" fill="#57606a" stroke="none" stroke-width="1"/>
<rect x="296" y="278" width="68" height="24" rx="3" fill="#57606a" stroke="none" stroke-width="1"/>
<circle cx="650" cy="262" r="13" fill="#d4a72c" stroke="none" stroke-width="1"/>
<text x="650" y="267" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">Y</text>
<circle cx="622" cy="290" r="13" fill="#0969da" stroke="none" stroke-width="1"/>
<text x="622" y="295" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">X</text>
<circle cx="678" cy="290" r="13" fill="#cf222e" stroke="none" stroke-width="1"/>
<text x="678" y="295" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">B</text>
<circle cx="650" cy="318" r="13" fill="#1a7f37" stroke="none" stroke-width="1"/>
<text x="650" y="323" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">A</text>
<circle cx="410" cy="350" r="30" fill="#57606a" stroke="none" stroke-width="1"/>
<circle cx="410" cy="350" r="18" fill="#8c959f" stroke="none" stroke-width="1"/>
<circle cx="570" cy="350" r="30" fill="#57606a" stroke="none" stroke-width="1"/>
<circle cx="570" cy="350" r="18" fill="#8c959f" stroke="none" stroke-width="1"/>
<line x1="345" y1="185" x2="250" y2="112" stroke="#59636e" stroke-width="1"/>
<text x="40" y="92" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">left_trigger</text>
<text x="40" y="110" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">0.0 (up) → 1.0 (pressed)</text>
<line x1="330" y1="216" x2="250" y2="172" stroke="#59636e" stroke-width="1"/>
<text x="40" y="162" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">left_bumper</text>
<text x="40" y="180" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">true / false</text>
<line x1="294" y1="290" x2="250" y2="258" stroke="#59636e" stroke-width="1"/>
<text x="40" y="236" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">dpad_up / dpad_down</text>
<text x="40" y="254" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">dpad_left / dpad_right</text>
<text x="40" y="272" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">true / false</text>
<line x1="380" y1="360" x2="250" y2="424" stroke="#59636e" stroke-width="1"/>
<text x="40" y="388" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">left_stick_x</text>
<text x="40" y="406" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">left −1 … right +1</text>
<text x="40" y="444" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#cf222e" font-weight="bold" text-anchor="start" xml:space="preserve">left_stick_y</text>
<text x="40" y="462" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">UP = −1 (!)  …  down = +1</text>
<line x1="635" y1="185" x2="730" y2="112" stroke="#59636e" stroke-width="1"/>
<text x="740" y="92" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">right_trigger</text>
<text x="740" y="110" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">0.0 (up) → 1.0 (pressed)</text>
<line x1="650" y1="216" x2="730" y2="172" stroke="#59636e" stroke-width="1"/>
<text x="740" y="162" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">right_bumper</text>
<text x="740" y="180" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">true / false</text>
<line x1="694" y1="290" x2="730" y2="258" stroke="#59636e" stroke-width="1"/>
<text x="740" y="236" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">a  b  x  y</text>
<text x="740" y="254" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">true / false</text>
<text x="740" y="272" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">PlayStation pads: a = cross,</text>
<text x="740" y="290" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">b = circle, x = square, y = triangle</text>
<line x1="600" y1="360" x2="730" y2="424" stroke="#59636e" stroke-width="1"/>
<text x="740" y="388" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">right_stick_x</text>
<text x="740" y="406" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">left −1 … right +1</text>
<text x="740" y="444" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" fill="#cf222e" font-weight="bold" text-anchor="start" xml:space="preserve">right_stick_y</text>
<text x="740" y="462" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">UP = −1 (!)  …  down = +1</text>
<rect x="150" y="500" width="680" height="44" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/>
<text x="490" y="528" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle" xml:space="preserve">Pushing a stick UP gives a NEGATIVE number. That’s why we write -gamepad1.left_stick_y.</text>
</svg>