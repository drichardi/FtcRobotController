<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590" role="img" aria-label="Anatomy of an OpMode">
<title>Anatomy of an OpMode</title>
<defs><marker id="m59636e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="589" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<text x="20" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">The parts of every OpMode</text>
<rect x="20" y="52" width="560" height="392" rx="8" fill="#1e1f22" stroke="none" stroke-width="1"/>
<text x="34" y="76" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#cf8e6d" font-weight="normal">package </tspan><tspan fill="#bcbec4" font-weight="normal">org.firstinspires.ftc.teamcode.students.ava;</tspan></text>
<text x="34" y="98" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="normal"></tspan></text>
<text x="34" y="120" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#cf8e6d" font-weight="normal">import </tspan><tspan fill="#bcbec4" font-weight="normal">com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;</tspan></text>
<text x="34" y="142" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#cf8e6d" font-weight="normal">import </tspan><tspan fill="#bcbec4" font-weight="normal">com.qualcomm.robotcore.eventloop.opmode.TeleOp;</tspan></text>
<text x="34" y="164" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="normal"></tspan></text>
<text x="34" y="186" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#b3ae60" font-weight="normal">@TeleOp</tspan><tspan fill="#bcbec4" font-weight="normal">(name = </tspan><tspan fill="#6aab73" font-weight="normal">&quot;L01 Hello Robot - Ava&quot;</tspan><tspan fill="#bcbec4" font-weight="normal">, group = </tspan><tspan fill="#6aab73" font-weight="normal">&quot;Ava&quot;</tspan><tspan fill="#bcbec4" font-weight="normal">)</tspan></text>
<text x="34" y="208" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#cf8e6d" font-weight="normal">public class </tspan><tspan fill="#bcbec4" font-weight="normal">L01_HelloRobot </tspan><tspan fill="#cf8e6d" font-weight="normal">extends </tspan><tspan fill="#bcbec4" font-weight="normal">LinearOpMode {</tspan></text>
<text x="34" y="230" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#b3ae60" font-weight="normal">    @Override</tspan></text>
<text x="34" y="252" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#cf8e6d" font-weight="normal">    public void </tspan><tspan fill="#bcbec4" font-weight="normal">runOpMode() {</tspan></text>
<text x="34" y="274" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="normal">        telemetry.addData(</tspan><tspan fill="#6aab73" font-weight="normal">&quot;Status&quot;</tspan><tspan fill="#bcbec4" font-weight="normal">, </tspan><tspan fill="#6aab73" font-weight="normal">&quot;Ready&quot;</tspan><tspan fill="#bcbec4" font-weight="normal">);</tspan></text>
<text x="34" y="296" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="normal">        telemetry.update();</tspan></text>
<text x="34" y="318" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="bold">        waitForStart();</tspan></text>
<text x="34" y="340" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#cf8e6d" font-weight="normal">        while </tspan><tspan fill="#bcbec4" font-weight="normal">(opModeIsActive()) {</tspan></text>
<text x="34" y="362" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="normal">            </tspan><tspan fill="#7a7e85" font-weight="normal">// runs over and over until STOP</tspan></text>
<text x="34" y="384" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="normal">        }</tspan></text>
<text x="34" y="406" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="normal">    }</tspan></text>
<text x="34" y="428" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#bcbec4" font-weight="normal">}</tspan></text>
<rect x="586" y="61" width="5" height="20" rx="2" fill="#0969da" stroke="none" stroke-width="1"/>
<text x="600" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">Which folder (package) this file lives in</text>
<rect x="586" y="105" width="5" height="42" rx="2" fill="#8250df" stroke="none" stroke-width="1"/>
<text x="600" y="131.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">Tools borrowed from the FTC SDK</text>
<rect x="586" y="171" width="5" height="20" rx="2" fill="#1f883d" stroke="none" stroke-width="1"/>
<text x="600" y="186.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">Puts the program on the Driver Station menu</text>
<rect x="586" y="193" width="5" height="20" rx="2" fill="#0969da" stroke="none" stroke-width="1"/>
<text x="600" y="208.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">The program’s name. Must match the file name.</text>
<rect x="586" y="237" width="5" height="20" rx="2" fill="#8250df" stroke="none" stroke-width="1"/>
<text x="600" y="252.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">Your instructions go inside runOpMode()</text>
<rect x="586" y="259" width="5" height="42" rx="2" fill="#bf8700" stroke="none" stroke-width="1"/>
<text x="600" y="285.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">INIT part: runs when you press INIT</text>
<rect x="586" y="303" width="5" height="20" rx="2" fill="#cf222e" stroke="none" stroke-width="1"/>
<text x="600" y="318.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">Waits here until you press START</text>
<rect x="586" y="325" width="5" height="64" rx="2" fill="#1f883d" stroke="none" stroke-width="1"/>
<text x="600" y="362.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">START part: repeats until you press STOP</text>
<text x="20" y="488" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">What happens when you use the Driver Station:</text>
<rect x="20" y="510" width="300" height="56" rx="8" fill="#ffffff" stroke="#bf8700" stroke-width="2"/>
<text x="34" y="533" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#bf8700" font-weight="bold" text-anchor="start" xml:space="preserve">Press INIT</text>
<text x="34" y="554" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">code above waitForStart() runs</text>
<line x1="324" y1="538" x2="346" y2="538" stroke="#59636e" stroke-width="2" marker-end="url(#m59636e)"/>
<rect x="350" y="510" width="300" height="56" rx="8" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
<text x="364" y="533" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#1f883d" font-weight="bold" text-anchor="start" xml:space="preserve">Press START</text>
<text x="364" y="554" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">code below it runs; the loop repeats</text>
<line x1="654" y1="538" x2="676" y2="538" stroke="#59636e" stroke-width="2" marker-end="url(#m59636e)"/>
<rect x="680" y="510" width="300" height="56" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/>
<text x="694" y="533" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#cf222e" font-weight="bold" text-anchor="start" xml:space="preserve">Press STOP</text>
<text x="694" y="554" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">opModeIsActive() turns false; it ends</text>
</svg>